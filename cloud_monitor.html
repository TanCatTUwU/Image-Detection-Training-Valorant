<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training progress</title><style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#111419;color:#e5e9ef}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1280px;margin:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:20px;font-weight:600;margin:0}#state{font-size:12px;background:#242c37;padding:5px 10px;border-radius:4px;text-transform:capitalize}#state.failed,#state.interrupted{color:#ffb2a6;background:#392526}#state.completed{color:#a9e8ba;background:#21352a}.meta{display:flex;justify-content:space-between;gap:12px;color:#9da8b7;font-size:12px;margin:12px 0}.progress{height:4px;background:#2a303a;margin-bottom:18px}.progress>div{height:100%;width:0;background:#80b9fc;transition:width .2s}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.metric,.plot{background:#181d24;border:1px solid #303846;border-radius:5px;padding:12px}.metric span{display:block;color:#a9b3c2;font-size:11px}.metric strong{display:block;font-size:23px;font-weight:500;margin-top:5px;font-variant-numeric:tabular-nums}.plots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.plot h2{font-size:13px;font-weight:500;margin:0 0 10px}.plot svg{display:block;width:100%;height:auto}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#a9b3c2;margin-top:8px}.legend span{display:flex;gap:5px;align-items:center}.legend i{width:12px;height:2px;display:inline-block}.empty{display:grid;place-items:center;min-height:190px;color:#9da8b7;font-size:13px}details{margin-top:18px}summary{font-size:13px;cursor:pointer;color:#c2ccda}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101318;border:1px solid #303846;border-radius:4px;padding:12px;max-height:360px;overflow:auto;font:12px/1.6 Consolas,monospace}#error{color:#ffb2a6;font-size:13px;white-space:pre-wrap}#connection{color:#e3bb7d;font-size:12px}footer{margin-top:12px;display:flex;gap:12px;justify-content:space-between;color:#9da8b7;font-size:11px}@media(max-width:760px){body{padding:14px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.plots{grid-template-columns:1fr}.metric strong{font-size:20px}.meta{flex-wrap:wrap}}@media(max-width:420px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main>
<header><h1>Training progress</h1><span id="state">Connecting</span></header>
<div class="meta"><span id="epoch">Waiting for the first epoch</span><span id="best"></span></div>
<div class="progress" role="progressbar" aria-label="Completed epochs" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div>
<div class="metrics"><div class="metric"><span>Train box loss</span><strong data-metric="train_box_loss">—</strong></div><div class="metric"><span>Val box loss</span><strong data-metric="val_box_loss">—</strong></div><div class="metric"><span>Val class loss</span><strong data-metric="val_cls_loss">—</strong></div><div class="metric"><span>mAP50</span><strong data-metric="map50">—</strong></div><div class="metric"><span>Precision</span><strong data-metric="precision">—</strong></div></div>
<div class="plots"><section class="plot" aria-label="Loss graph"><h2>Loss</h2><div id="loss"></div></section><section class="plot" aria-label="Validation graph"><h2>Validation</h2><div id="quality"></div></section></div>
<p id="error" hidden></p><details id="logs"><summary>Live logs</summary><pre id="log">Waiting for logs…</pre></details>
<footer><span id="resolution"></span><span id="connection" role="status"></span></footer>
</main><script>
const $=id=>document.getElementById(id), token=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('monitor-token')||'';
if(token)sessionStorage.setItem('monitor-token',token);
const lossSeries=[['train_box_loss','Train box','#80b9fc'],['val_box_loss','Val box','#b2efbc'],['val_cls_loss','Val class','#edc376']], qualitySeries=[['map50','mAP50','#b2efbc'],['precision','Precision','#80b9fc']];
let signature='',lastState='',pending=false,timer=null,stopped=false;
const number=(v,percent=false)=>Number.isFinite(v)?percent?(v*100).toFixed(1)+'%':v.toFixed(4):'—';
function plot(id,history,series,percent=false){
 const parent=$(id);parent.replaceChildren();const rows=history.filter(r=>Number.isFinite(r.epoch)),values=rows.flatMap(r=>series.map(s=>r[s[0]]).filter(Number.isFinite));
 if(!values.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Waiting for the first epoch';parent.append(empty);return;}
 const ns='http://www.w3.org/2000/svg',W=540,H=250,L=54,R=14,T=12,B=32,first=Math.min(...rows.map(r=>r.epoch)),last=Math.max(...rows.map(r=>r.epoch)),max=Math.max(percent?1:0,...values),min=Math.min(0,...values);
 const node=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==undefined)e.textContent=text;return e;};
 const svg=node('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':id==='loss'?'Training and validation loss by epoch':'mAP50 and precision by epoch'}),x=e=>L+(first===last?.5:(e-first)/(last-first))*(W-L-R),y=v=>H-B-(v-min)/(max-min||1)*(H-T-B);
 for(const f of[0,.5,1]){const v=min+(max-min)*f;svg.append(node('line',{x1:L,y1:y(v),x2:W-R,y2:y(v),stroke:'#303846'}),node('text',{x:L-8,y:y(v)+4,fill:'#a9b3c2','font-size':11,'text-anchor':'end'},percent?(v*100).toFixed(0)+'%':v.toFixed(2)));}
 for(const e of first===last?[first]:[first,last])svg.append(node('text',{x:x(e),y:H-12,fill:'#a9b3c2','font-size':11,'text-anchor':'middle'},e));
 const legend=document.createElement('div');legend.className='legend';
 for(const[key,label,color]of series){let segment=[],segments=[],previous=null;for(const row of rows){if(!Number.isFinite(row[key])||previous!==null&&row.epoch>previous+1){if(segment.length)segments.push(segment);segment=[];}if(Number.isFinite(row[key]))segment.push(row);previous=row.epoch;}if(segment.length)segments.push(segment);for(const points of segments){svg.append(node('path',{d:points.map((r,i)=>`${i?'L':'M'}${x(r.epoch).toFixed(2)},${y(r[key]).toFixed(2)}`).join(' '),fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round'}));for(const row of points){const dot=node('circle',{cx:x(row.epoch),cy:y(row[key]),r:2.5,fill:color});dot.append(node('title',{},`${label}, epoch ${row.epoch}: ${number(row[key],percent)}`));svg.append(dot);}}const item=document.createElement('span'),swatch=document.createElement('i');swatch.style.background=color;item.append(swatch,document.createTextNode(label));legend.append(item);}
 parent.append(svg,legend);
}
function render(data){
 const state=String(data.state||'waiting');$('state').textContent=state;$('state').className=state;const metrics=data.metrics||{},latest=metrics.latest,epoch=latest?.epoch||0,total=Number(data.epochs)||0;
 $('epoch').textContent=epoch?`Epoch ${epoch}${total?' / '+total:''}`:'Waiting for the first epoch';$('best').textContent=metrics.best_epoch?'Best epoch '+metrics.best_epoch:'';const progress=total?Math.min(100,epoch/total*100):0;$('progress').style.width=progress+'%';$('progress').parentElement.setAttribute('aria-valuenow',progress.toFixed(1));
 for(const el of document.querySelectorAll('[data-metric]'))el.textContent=number(latest?.[el.dataset.metric],['map50','precision'].includes(el.dataset.metric));
 const next=JSON.stringify(metrics.history||[]);if(next!==signature){signature=next;plot('loss',metrics.history||[],lossSeries);plot('quality',metrics.history||[],qualitySeries,true);}
 $('error').hidden=!data.error;$('error').textContent=data.error||'';if(state==='failed'&&lastState!==state)$('logs').open=true;lastState=state;
 if(typeof data.log==='string'&&$('log').textContent!==data.log){const el=$('log'),follow=el.scrollHeight-el.scrollTop-el.clientHeight<40;el.textContent=data.log||'No log output yet.';if(follow)el.scrollTop=el.scrollHeight;}
 $('resolution').textContent=Array.isArray(data.resolution)&&data.resolution.every(Number.isFinite)?data.resolution.join(' × ')+' model':'';
}
async function refresh(){if(pending||stopped)return;if(document.hidden){timer=setTimeout(refresh,3000);return;}pending=true;try{const response=await fetch('/api/status'+($('logs').open?'?logs=1':''),{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(response.status===403){stopped=true;throw Error('Open the protected dashboard link printed in SSH.');}if(!response.ok)throw Error('Dashboard unavailable');render(await response.json());$('connection').textContent='';}catch(error){$('connection').textContent=stopped?error.message:'Reconnecting…';}finally{pending=false;if(!stopped){clearTimeout(timer);timer=setTimeout(refresh,3000);}}}
$('logs').addEventListener('toggle',()=>{if($('logs').open)refresh();});document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(timer);refresh();}});refresh();
</script></body></html>
